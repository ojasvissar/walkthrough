<!doctype html>
<html lang="en" class="audience-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d201a">
  <meta name="color-scheme" content="dark light">
  <title>WalkThrough Audience</title>
  <link rel="icon" href="./assets/icons/walkthrough.svg">
  <script src="./js/theme.js"></script>
  <link rel="stylesheet" href="./styles/audience.css">
  <link rel="stylesheet" href="./styles/theme.css">
  <link rel="stylesheet" href="./styles/brutalist.css">
</head>
<body>
  <main>
    <header>
      <img src="./assets/icons/walkthrough.svg" width="36" height="36" alt="">
      <h1>WalkThrough<span>.</span></h1>
      <div class="appearance-tools" role="group" aria-label="Appearance">
        <button type="button" class="style-toggle" data-style-toggle aria-label="Neo-brutalist style" aria-pressed="false" hidden>Style</button>
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="Dark mode" aria-pressed="false" hidden></button>
      </div>
    </header>
    <p>Choose a floor, then tap the plan to move your dot in the presenter’s building.</p>
    <label for="floor">Floor</label>
    <select id="floor"><option value="3">04 · Interface</option><option value="2">03 · API</option><option value="1" selected>02 · Services</option><option value="0">01 · Database</option></select>
    <button id="map" aria-label="Move around the floor plan">
      <span class="room">West</span><span class="room">Center</span><span class="room">East</span>
      <span class="hall">Hallway</span><span id="dot"></span>
    </button>
    <p id="status" role="status">Joining the presentation…</p>
  </main>
  <script type="module" src="./js/audience/guest-page.js"></script>
</body></html>
