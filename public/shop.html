<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f1eb">
  <meta name="color-scheme" content="light dark">
  <title>The Tiny Shop · WalkThrough</title>
  <link rel="icon" href="./assets/icons/walkthrough.svg">
  <script src="./js/theme.js"></script>
  <link rel="stylesheet" href="./styles/app.css">
  <link rel="stylesheet" href="./styles/theme.css">
</head>
<body>
  <header class="masthead"><div class="top-inner shop-bar"><a class="brand" href="./">WalkThrough<span class="brand-dot">.</span></a><span>The Tiny Shop</span><button type="button" class="theme-toggle" data-theme-toggle aria-label="Dark mode" aria-pressed="false" hidden></button></div></header>
  <main class="shop-page">
    <div class="repo-context"><span class="repo-badge">DEMO STORE</span></div>
    <h1>The Tiny Shop<span>.</span></h1>
    <p>Sign in here and watch the request reach the WalkThrough building in the other tab.</p>
    <div class="store-grid">
      <section class="store-card"><h2>Sign in</h2>
        <form id="shop-login" class="store-form">
          <label>Demo email<input name="email" type="email" autocomplete="off" required></label>
          <label>Demo password<input name="password" type="password" autocomplete="off" required></label>
          <label class="check"><input type="checkbox" name="slow">Slow user lookup</label>
          <button class="btn primary" type="submit">Log in</button>
        </form>
        <p id="shop-login-status" role="status"></p>
      </section>
      <section class="store-card"><h2>Catalog</h2><div id="shop-catalog"></div><p id="shop-cart"></p><button class="btn dark" id="checkout">Checkout</button><p id="checkout-status" role="status"></p></section>
    </div>
  </main>
  <script type="module" src="./js/shop/shop-page.js"></script>
</body>
</html>
